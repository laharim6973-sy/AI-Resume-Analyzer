<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI Resume Web Application{% endblock %}</title>
{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #050810;
  --bg-secondary: #080d1a;
  --bg-card: #0d1525;
  --bg-card-hover: #111c30;
  --border: rgba(99,179,237,0.12);
  --border-glow: rgba(99,179,237,0.35);
  --accent: #63b3ed;
  --accent2: #68d391;
  --accent3: #f6ad55;
  --accent4: #fc8181;
  --accent5: #b794f4;
  --text-primary: #e2e8f0;
  --text-secondary: #718096;
  --text-muted: #4a5568;
  --gradient: linear-gradient(135deg, #63b3ed, #b794f4);
  --gradient2: linear-gradient(135deg, #68d391, #63b3ed);
  --glow: 0 0 30px rgba(99,179,237,0.15);
  --glow-strong: 0 0 60px rgba(99,179,237,0.25);
  --radius: 12px;
  --radius-lg: 20px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Animated background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(99,179,237,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,179,237,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Floating orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: float 8s ease-in-out infinite;
}
.orb-1 { width: 400px; height: 400px; background: rgba(99,179,237,0.06); top: -100px; right: -100px; animation-delay: 0s; }
.orb-2 { width: 300px; height: 300px; background: rgba(183,148,244,0.06); bottom: 100px; left: -80px; animation-delay: 3s; }
.orb-3 { width: 250px; height: 250px; background: rgba(104,211,145,0.04); top: 40%; left: 50%; animation-delay: 5s; }

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-30px); }
}

/* Navigation */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(5,8,16,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.nav-logo {
  width: 36px;
  height: 36px;
  background: var(--gradient);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  color: white;
  font-weight: 700;
}

.nav-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-links {
  display: flex;
  gap: 0.5rem;
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 0.875rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 8px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-links a:hover, .nav-links a.active {
  color: var(--accent);
  background: rgba(99,179,237,0.08);
}

/* Main wrapper */
main {
  padding-top: 64px;
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

/* Card component */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  transition: all 0.3s;
}

.card:hover {
  border-color: var(--border-glow);
  box-shadow: var(--glow);
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.badge-blue { background: rgba(99,179,237,0.15); color: var(--accent); border: 1px solid rgba(99,179,237,0.25); }
.badge-green { background: rgba(104,211,145,0.15); color: var(--accent2); border: 1px solid rgba(104,211,145,0.25); }
.badge-orange { background: rgba(246,173,85,0.15); color: var(--accent3); border: 1px solid rgba(246,173,85,0.25); }
.badge-red { background: rgba(252,129,129,0.15); color: var(--accent4); border: 1px solid rgba(252,129,129,0.25); }
.badge-purple { background: rgba(183,148,244,0.15); color: var(--accent5); border: 1px solid rgba(183,148,244,0.25); }

/* Button */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
}

.btn-primary {
  background: var(--gradient);
  color: white;
  box-shadow: 0 4px 20px rgba(99,179,237,0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(99,179,237,0.4);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  color: var(--accent);
  border-color: var(--border-glow);
  background: rgba(99,179,237,0.06);
}

/* Score ring animation */
@keyframes dash {
  to { stroke-dashoffset: 0; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(99,179,237,0.2); }
  50% { box-shadow: 0 0 40px rgba(99,179,237,0.4); }
}

/* Skill tag */
.skill-tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  background: rgba(99,179,237,0.08);
  border: 1px solid rgba(99,179,237,0.18);
  border-radius: 999px;
  font-size: 0.78rem;
  font-family: 'Space Mono', monospace;
  color: var(--accent);
  transition: all 0.2s;
  cursor: default;
}

.skill-tag:hover {
  background: rgba(99,179,237,0.18);
  transform: translateY(-1px);
}

/* Toast */
#toast-container {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 0.85rem;
  animation: fadeUp 0.3s ease;
  max-width: 300px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }

/* Responsive */
@media (max-width: 768px) {
  .nav-links { display: none; }
  nav { padding: 0 1rem; }
}

/* Progress bar */
.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 1s ease;
}

/* Section header */
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.25rem;
}

.section-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}

.section-icon-blue { background: rgba(99,179,237,0.15); }
.section-icon-green { background: rgba(104,211,145,0.15); }
.section-icon-purple { background: rgba(183,148,244,0.15); }
.section-icon-orange { background: rgba(246,173,85,0.15); }

.section-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text-primary);
}

.section-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Footer */
footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--border);
  padding: 1.5rem 2rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-family: 'Space Mono', monospace;
}

footer span { color: var(--accent); }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<nav>
  <div class="nav-inner">
    <a href="{% url 'index' %}" class="nav-brand">
      <div class="nav-logo">AI</div>
      <span class="nav-title">ResumeAI Pro</span>
    </a>
    <ul class="nav-links">
      <li><a href="{% url 'index' %}" {% if request.resolver_match.url_name == 'index' %}class="active"{% endif %}>⬆ Upload</a></li>
      <li><a href="{% url 'history' %}" {% if request.resolver_match.url_name == 'history' %}class="active"{% endif %}>📋 History</a></li>
      <li><a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>📊 Dashboard</a></li>
      <li><a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>ℹ️ About</a></li>
    </ul>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  <p>🤖 AI Resume Web Application | Built with <span>Django + ML/NLP</span> | © 2026</p>
</footer>

<div id="toast-container"></div>

<script>
function showToast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderColor = type === 'success' ? 'rgba(104,211,145,0.4)' : type === 'error' ? 'rgba(252,129,129,0.4)' : 'var(--border)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.style.opacity = '0', 2500);
  setTimeout(() => t.remove(), 3000);
}
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
